name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Typecheck, test, build and verify the add-on
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      # Fetches the existing Underworld world, bakes it into structure tiles,
      # assembles the .mcaddon and runs verify.ts - which fails the job unless
      # every extracted block round-trips back out of the finished package.
      - name: Build and verify the .mcaddon
        run: bun run build:addon

      - name: Upload the .mcaddon
        uses: actions/upload-artifact@v7
        with:
          name: SakuraUnderworldDimension
          path: dist/SakuraUnderworldDimension.mcaddon
          if-no-files-found: error
